name: Live public-data probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-probe.yml'
      - 'fundwatch.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query actual upstream data for 011609
        run: python fundwatch.py 011609 --require-current
